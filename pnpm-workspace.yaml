# pnpm settings for this project. The Solid packages release in lockstep
# and templates track them closely; exclude the whole family from any
# minimumReleaseAge policy so fresh Solid releases install immediately.
#
# NOTE: this exclusion is a temporary measure for the Solid 2.0 prerelease
# cycle (frequent lockstep releases where new floors would otherwise fail
# under an age policy). It should be removed once Solid 2.0 is stable —
# at that point a caret range nearly always contains an age-satisfying
# release and the policy can protect these packages like any other.
packages:
  - apps/*
  - e2e
  - infra
  - packages/*
minimumReleaseAgeExclude:
  - solid-js
  - "@solidjs/*"
  - "@uppy/aws-s3@6.2.1"
  - "@uppy/core@6.1.0"
  - "@effect/platform-node@4.0.1"
  - "@effect/tsgo-darwin-arm64@0.48.1"
  - "@effect/tsgo-darwin-x64@0.48.1"
  - "@effect/tsgo-linux-arm64@0.48.1"
  - "@effect/tsgo-linux-arm@0.48.1"
  - "@effect/tsgo-linux-x64@0.48.1"
  - "@effect/tsgo-win32-arm64@0.48.1"
  - "@effect/tsgo-win32-x64@0.48.1"
  - "@effect/tsgo@0.48.1"
  - "@alchemy.run/better-auth@2.0.0-beta.81"
  - "@alchemy.run/cloudflare-runtime@2.0.0-beta.81"
  - "@alchemy.run/floci@2.0.0-beta.81"
  - "@alchemy.run/node-utils@2.0.0-beta.81"
  - alchemy@2.0.0-beta.81
  - "@cloudflare/workers-types@5.20261006.1"
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.0.0
  vite-plus: 1.0.0
  solid-js: 2.0.0-rc.13
  "@solidjs/web": 2.0.0-rc.13
  "@solidjs/diagnostics": 2.0.0-rc.13
  effect: 4.0.1
  "@effect/platform-node": 4.0.1
  "@effect/vitest": 4.0.1
  # vite-plus 1.0.0 bundles vitest 5.0.1. A second copy splits the test runner.
  vitest: 5.0.1
  typescript: 7.0.2
  "@types/node": 26.6.4
  "@cloudflare/workers-types": 5.20261006.1
  drizzle-orm: 1.0.0-rc.5-ab785fc
  drizzle-kit: 1.0.0-rc.5-ab785fc
overrides:
  vitest: "catalog:"
  vite@*: "catalog:"
  "@better-auth/drizzle-adapter>drizzle-orm": "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
allowBuilds:
  esbuild: true
  "@parcel/watcher": false
  msgpackr-extract: false
  workerd: true
patchedDependencies:
  "@uppy/aws-s3@6.2.1": patches/@uppy__aws-s3@6.2.1.patch
