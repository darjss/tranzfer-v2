# pnpm settings for this project. The Solid packages release in lockstep
# and templates track them closely; exclude the whole family from any
# minimumReleaseAge policy so fresh Solid releases install immediately.
#
# NOTE: this exclusion is a temporary measure for the Solid 2.0 prerelease
# cycle (frequent lockstep releases where new floors would otherwise fail
# under an age policy). It should be removed once Solid 2.0 is stable —
# at that point a caret range nearly always contains an age-satisfying
# release and the policy can protect these packages like any other.
packages:
  - apps/*
  - infra
  - packages/*
minimumReleaseAgeExclude:
  - solid-js
  - "@solidjs/*"
  - effect-cf@0.44.1 || 0.44.1
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@0.3.1
  vite-plus: 0.3.1
  solid-js: 2.0.0-rc.8
  "@solidjs/web": 2.0.0-rc.8
  "@solidjs/diagnostics": 2.0.0-rc.8
overrides:
  vite@*: "catalog:"
  "@effect/platform-node>@effect/platform-node-shared": 4.0.0-rc.112
  "@effect/platform-node-shared>@effect/platform": 4.0.0-rc.112
  alchemy>@effect/sql-d1: 4.0.0-rc.112
  alchemy>@effect/sql-sqlite-do: 4.0.0-rc.112
  alchemy>@effect/vitest: 4.0.0-rc.112
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
allowBuilds:
  esbuild: true
  msgpackr-extract: false
  workerd: true
packageExtensions:
  alchemy:
    dependencies:
      "@effect/platform-node": "4.0.0-rc.112"
      effect: "4.0.0-rc.112"
patchedDependencies:
  "@distilled.cloud/aws@1.0.0-rc.9": patches/@distilled.cloud__aws@1.0.0-rc.9.patch
  "@distilled.cloud/core@1.0.0-rc.9": patches/@distilled.cloud__core@1.0.0-rc.9.patch
  drizzle-orm@1.0.0-rc.4: patches/drizzle-orm@1.0.0-rc.4.patch
