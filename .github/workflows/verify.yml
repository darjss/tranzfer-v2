name: verify

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: voidzero-dev/setup-vp@9fd26ff49f9b5e6276c2b493da4454ad4527f7f4 # v1.20.0
        with:
          cache: true
          node-version: "24"
      - run: vp check
      - run: vp run test
      # Production is never one local command from deletion: no script destroys
      # a fixed stage, and no production script skips the approval prompt.
      - name: Guard production scripts
        run: |
          jq -e '[.scripts[] | select(test("cli\\.js destroy") and (contains("$ALCHEMY_STAGE") | not))] == []' infra/package.json
          jq -e '[.scripts | to_entries[] | select(.value | contains("--stage production") and contains("--yes"))] == []' infra/package.json
